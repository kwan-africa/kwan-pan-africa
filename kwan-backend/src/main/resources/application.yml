spring:
  application:
    name: kwan-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/kwan}
    username: ${SPRING_DATASOURCE_USERNAME:kwan_user}
    password: ${SPRING_DATASOURCE_PASSWORD:kwan_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    defer-datasource-initialization: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: 8080

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
    generation-model: ${GEMINI_GENERATION_MODEL:gemini-flash-latest}
  rag:
    top-k: 8
    similarity-threshold: 0.7

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}
  base-url: https://api.paystack.co
  platform-fee-percent: 5.0
  callback-url: ${PAYSTACK_CALLBACK_URL:http://localhost:8080/api/payments/verify}

google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}

cors:
  # Specify exact origins — never use "*" in production.
  # Override via CORS_ALLOWED_ORIGINS env var on your server.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8081,http://127.0.0.1:5173,http://127.0.0.1:8080}
