services:
  - type: web
    name: kwan-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: APPWRITE_ENDPOINT
        value: https://fra.cloud.appwrite.io/v1
      - key: APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false
      - key: APPWRITE_DATABASE_ID
        value: kwan_db
      - key: APPWRITE_HOSTS_COLLECTION_ID
        value: hosts
      - key: APPWRITE_BOOKINGS_COLLECTION_ID
        value: bookings
      - key: APPWRITE_LEDGER_COLLECTION_ID
        value: escrow_ledgers
      - key: PAYSTACK_ENDPOINT
        value: https://api.paystack.co
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
    healthCheckPath: /health
